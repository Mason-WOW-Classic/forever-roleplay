name: Verify source and bundles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install optional Lua test runtime
        run: python -m pip install lupa==2.8
      - name: Verify published source bytes
        run: python tools/provenance.py --check
      - name: Run offline Python and Lua simulations
        run: python -m unittest discover -s tests -v
      - name: Build and verify source bundles
        run: python tools/build_release.py
      - name: Confirm build preserved the manifest
        run: git diff --exit-code -- SOURCE-MANIFEST.json
